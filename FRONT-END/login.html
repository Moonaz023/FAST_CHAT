<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Login | Fast Chat</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="header-brand">
        <a href="index.html">
          <img id="brand-logo" class="brand-logo" src="assets/img/fc-logo.png" alt="Fast Chat">
        </a>
      </div>


      <form id="loginForm" class="form">
        <input id="loginEmail" type="email" placeholder="Email" required />
        <input id="loginPassword" type="password" placeholder="Password" required />
        <button class="btn btn-primary" type="submit">Login</button>
      </form>

      <form id="registerForm" class="form" style="display:none">
        <input id="regName" type="text" placeholder="Full name" required />
        <input id="regEmail" type="email" placeholder="Email" required />
        <input id="regPassword" type="password" placeholder="Password" required />
        <button class="btn btn-primary" type="submit">Create account</button>
        <button class="btn btn-ghost" id="backToLogin" type="button">Back to Login</button>
      </form>

      <div class="or">or</div>

      <div class="socials">
        <button id="googleBtn" class="btn-social btn-google" title="Google">
          <i class="fa-brands fa-google"></i>
        </button>

        <button id="githubBtn" class="btn-social btn-github" title="GitHub">
          <i class="fa-brands fa-github"></i>
        </button>

        <button id="linkedinBtn" class="btn-social btn-linkedin" title="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </button>
      </div>

      <div class="footer-links">
        <a id="toggleRegister" href="#">New here? Create account</a>
      </div>

      <div id="result" class="alert" style="display:none"></div>
    </div>
  </div>

  <script type="module" src="assets/js/auth.js"></script>
</body>

</html>
