<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile | Fast Chat</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="profile-page">
  <header class="topbar">
    <div class="brand">Fast Chat</div>
    <nav>
      <button class="btn btn-ghost" onclick="window.location.href='home.html'">Back</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </nav>
  </header>

  <main class="profile-main">
    <section class="profile-card">
      <img id="profileAvatar" src="assets/img/avatar-placeholder.png" class="avatar-lg" alt="avatar"/>
      <h2 id="profileName">Loading...</h2>
      <p id="profileEmail" class="muted">—</p>

      <div class="profile-details">
        <div class="row">
          <div class="label">Provider</div>
          <div id="detailProvider">—</div>
        </div>
        <div class="row">
          <div class="label">User ID</div>
          <div id="detailId">—</div>
        </div>
        <div class="row">
          <div class="label">Status</div>
          <div id="detailStatus">Active</div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/profile.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
