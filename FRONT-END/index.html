<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fast Chat — Landing</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="assets/css/base.css" />
</head>
<body class="landing">
  <header class="topbar">
    <div class="brand">Fast Chat</div>
    <nav>
      <a class="btn" href="login.html">Sign In</a>
    </nav>
  </header>

  <main class="landing-main">
    <section class="hero">
      <h1>Fast Chat</h1>
      <p>Lightweight, fast messaging with AI-like interface.</p>
      <div class="actions">
        <a class="btn btn-primary" href="login.html">Get Started — Sign In</a>
      </div>
    </section>

    <section class="features">
      <div class="feature">
        <h3>Conversations</h3>
        <p>Simple, clean UI to hold your chats.</p>
      </div>
      <div class="feature">
        <h3>Secure</h3>
        <p>OAuth2 ready + JWT token storage (browser only).</p>
      </div>
      <div class="feature">
        <h3>Profile</h3>
        <p>One-click access to your profile and logout.</p>
      </div>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> Fast Chat</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
