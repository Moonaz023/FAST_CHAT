spring.application.name=fast_chat-core

# ---------------------------------------------
# SERVER SETTINGS
# ---------------------------------------------
server.port=8080

api.key=

# Postgres Connection Configuration for SQL Server
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.data.mongodb.uri=


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ---------------------------------------------
# SPRING SECURITY - OAUTH2 (Google)
# ---------------------------------------------
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=email,profile

# Optional: specify which OAuth2 providers Spring should use
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ==============================
# LINKEDIN : Working in 2025 (OpenID Connect)
# ==============================

spring.security.oauth2.client.registration.linkedin.client-id=
spring.security.oauth2.client.registration.linkedin.client-secret=

spring.security.oauth2.client.registration.linkedin.scope=openid,profile,email
spring.security.oauth2.client.registration.linkedin.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.linkedin.client-name=LinkedIn
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.provider=linkedin
spring.security.oauth2.client.registration.linkedin.client-authentication-method=client_secret_post

# LinkedIn OAuth2 provider details
spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/userinfo
spring.security.oauth2.client.provider.linkedin.jwk-set-uri=https://www.linkedin.com/oauth/openid/jwks

# ---------------------------------------------
# SPRING SECURITY - OAUTH2 (GitHub)
# ---------------------------------------------
spring.security.oauth2.client.registration.github.client-id:
spring.security.oauth2.client.registration.github.client-secret: 
spring.security.oauth2.client.registration.github.scope: read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri: http://localhost:8080/login/oauth2/code/github

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Modern way: Auto-discover everything (GitHub supports OpenID Connect)
#spring.security.oauth2.client.provider.github.issuer-uri: https://token.actions.githubusercontent.com

# ---------------------------------------------
# LOGGING
# ---------------------------------------------
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ---------------------------------------------
# JWT (custom application values)
# ---------------------------------------------
app.jwt.secret=
app.jwt.expiration=86400000   # 1 day in milliseconds



